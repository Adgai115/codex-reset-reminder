<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>设置</title>
<style>
  :root { color-scheme:light dark; --bg:#f7f9fc; --surface:#fff; --ink:#233247; --muted:#6b798e;
    --line:#dfe6ef; --field-line:#ccd7e3; --button-line:#cbd5e1; --status:#52617a; --danger:#b42318;
    --warning:#a04320; --accent:#1458df; }
  @media (prefers-color-scheme:dark) { :root { --bg:#171c25; --surface:#202734; --ink:#e2e9f4;
    --muted:#a5b3c8; --line:#3b475a; --field-line:#495972; --button-line:#495972; --status:#a5b3c8;
    --danger:#ffb49e; --warning:#ffb49e; --accent:#91b4ff; } }

  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
    font: 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  main { padding: 22px 26px; flex: 1; min-height:0; overflow-y: auto; }
  h1 { margin: 0 0 10px; font-size: 21px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  p, small { color: var(--muted); line-height: 1.5; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 10px; }
  section.secondary-settings { background:transparent; border:0; padding:0 2px; margin-top:12px; }
  .secondary-settings > details { padding:10px 0; }
  .secondary-settings > details > summary { font-size:13px; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .status-link { color:var(--muted); font-size:12px; border:0; padding:2px 0; }
  .line { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
  .line input[type=checkbox] { width: 16px; height: 16px; }
  .field { display: block; margin: 10px 0; }
  .field input { margin-top: 5px; display: block; width: 100%; padding: 8px; border: 1px solid var(--field-line); border-radius: 7px; background:var(--surface); color:var(--ink); font: inherit; }
  .clocks { display: flex; gap: 14px; align-items: center; }
  .clocks input { width: 110px; }
  button { border: 1px solid var(--button-line); background: var(--surface); border-radius: 7px; padding: 8px 13px; cursor: pointer; color:var(--ink); font: inherit; white-space:nowrap; }
  .status-link.error { color:var(--danger); }
  button.primary { background: #1458df; color: white; border-color: #1458df; }
  button:disabled { opacity: .5; cursor: wait; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { flex-shrink:0; padding: 10px 26px 16px; background: var(--bg); border-top: 1px solid var(--line); }
  .footer-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #status { color: var(--status); margin: 0 0 8px; overflow-wrap: anywhere; font-size:12px; }
  #status:empty, #codex-probe:empty { display:none; }
  #status.error { color: var(--danger); }
  #channel-warning { display: block; margin-top: 8px; color: var(--warning); }
  summary { font-weight:500; cursor:pointer; color:var(--status); white-space:nowrap; }
  details[open] summary { margin-bottom: 12px; }
  #listener-state { display: block; margin-top: 7px; }
  #diagnostics { margin: 8px 0; padding-left: 18px; color: var(--status); line-height: 1.7; }
  [hidden] { display: none !important; }
  input[type=checkbox] { accent-color:#1458df; }
  .clocks input { color:var(--ink); background:var(--surface); }
  #listener-state, #diagnostics, #codex-probe, #update-state { overflow-wrap:anywhere; }
  button:active:not(:disabled) { transform:translateY(1px); }
  .settings-tabs { display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .settings-tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; padding:9px 14px; background:transparent; color:var(--muted); }
  .settings-tabs button[aria-selected=true] { border-bottom-color:var(--accent); color:var(--accent); }
  .accounts-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .accounts-heading h2 { margin:0; }
  .account-row { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); }
  .account-row:last-child { border-bottom:0; }
  .account-info { min-width:0; }
  .account-name input { display:block; width:100%; max-width:230px; min-width:0; padding:6px 8px; border:1px solid var(--field-line); border-radius:6px; color:var(--ink); background:var(--surface); font:inherit; }
  .account-meta { display:flex; gap:8px; min-width:0; margin-top:6px; color:var(--muted); font-size:12px; }
  .account-state { white-space:nowrap; }
  .account-actions { display:flex; align-items:center; gap:7px; font-size:12px; }
  .account-actions button { padding:6px 8px; font-size:12px; }
  .account-actions label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .account-actions input { margin:0; width:15px; height:15px; }
  .account-row[data-selected=true] [data-account-view] { color:var(--accent); border-color:var(--accent); }
  .account-tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .account-tools button { padding:7px 10px; font-size:12px; }
  #account-notice, #login-status { margin:12px 0 0; font-size:12px; color:var(--status); overflow-wrap:anywhere; }
  #account-notice.error, #login-status.error { color:var(--danger); }
  #account-notice:empty, #login-status:empty { display:none; }
  .accounts-empty { padding:18px 0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>设置</h1>
  <div class="settings-tabs" role="tablist" aria-label="设置分类">
    <button id="reminders-tab" type="button" role="tab" aria-controls="reminders-panel" aria-selected="true">提醒</button>
    <button id="accounts-tab" type="button" role="tab" aria-controls="accounts-panel" aria-selected="false" tabindex="-1">账号</button>
  </div>
  <div id="reminders-panel" role="tabpanel" aria-labelledby="reminders-tab">
  <section><h2>启动与通知</h2>
    <label class="line" title="登录后自动启动到托盘"><input id="autostart" type="checkbox">登录时自动启动</label>
    <label class="line"><input id="desktop" type="checkbox">桌面提醒</label>
    <div class="toggle-row"><label class="line"><input id="feishu" type="checkbox">飞书私聊</label>
      <button id="feishu-state" class="status-link" type="button">读取中…</button></div>
    <small id="channel-warning" hidden>提醒已关闭</small>
  </section>
  <section><h2>免打扰</h2>
    <label class="line" title="时段内延后提醒；若会超过到期时间，仍按原时间提醒"><input id="quiet" type="checkbox">开启免打扰</label>
    <div class="clocks" title="电脑本地时间"><input id="quiet-start" type="time" aria-label="免打扰开始时间">至<input id="quiet-end" type="time" aria-label="免打扰结束时间"></div>
  </section>
  <section class="secondary-settings"><details id="feishu-connection"><summary>飞书连接</summary>
    <label class="field">App ID<input id="app-id" placeholder="cli_…"></label>
    <label class="field">接收人 ID<input id="recipient-id" placeholder="ou_… 或 on_…"></label>
    <label class="field">lark-cli 脚本路径<input id="lark-path"></label>
    <label class="field" title="仅连接时输入，由本机 lark-cli 保管">App Secret<input id="secret" type="password" autocomplete="new-password"></label>
    <button id="reconnect">重新连接</button><button id="connect" class="primary">连接并测试</button>
    <p><small>将发送一条测试私聊。</small></p>
  </details>
  <details id="advanced-settings"><summary>更多设置</summary>
    <label class="line"><input id="preflight" type="checkbox">提醒前核对卡片</label>
    <label class="field">最短间隔（分钟）<input id="retry" type="number" min="10" max="1440"></label>
  </details>
  <details id="connection-diagnostics"><summary>连接诊断</summary>
    <small id="listener-state" aria-live="polite">读取中…</small>
    <ul id="diagnostics"><li>正在检查本地配置…</li></ul>
    <button id="probe-codex" type="button" title="只读取 Usage，不会使用重置卡">检查连接</button>
    <button id="repair-codex" type="button" title="验证连接成功后替换路径">选择 Codex 程序</button>
    <p><small id="codex-probe" role="status" aria-live="polite"></small></p>
  </details>
  <details id="update-details"><summary>关于</summary>
    <button id="check-updates" type="button">检查更新</button>
    <button id="download-update" type="button" hidden>下载更新</button>
    <button id="install-update" type="button" class="primary" hidden>立即升级</button>
    <button id="open-update" type="button" hidden>打开下载页</button>
    <small id="update-state" role="status" aria-live="polite"></small>
  </details></section>
  </div>
  <div id="accounts-panel" role="tabpanel" aria-labelledby="accounts-tab" hidden>
    <section>
      <div class="accounts-heading"><h2>账号</h2><button id="add-account" type="button">添加账号</button></div>
      <div id="account-list">读取中…</div>
      <div class="account-tools">
        <button id="check-account" type="button">重新核对账号</button>
        <button id="get-current-account" type="button" title="读取当前 Codex CLI 登录的账号">获取 Codex 账号</button>
        <button id="bind-account" type="button" hidden>确认账号</button>
        <button id="cancel-login" type="button" hidden>取消登录</button>
      </div>
      <p id="account-notice" role="status" aria-live="polite"></p>
      <p id="login-status" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>
<footer><div id="status" role="status" aria-live="polite"></div>
  <div class="footer-actions"><button id="test">测试提醒</button><button id="cancel">取消</button><button id="save" class="primary">保存</button></div>
</footer>
<script type="module">
  import { createAccountsSettings } from './accounts.mjs';
  const $ = (id) => document.getElementById(id);
  let connected = false;
  let unlocked = true;
  let saving = false;
  let accountWorking = false;
  let accountDraftDirty = false;
  let accountController = null;
  let selectedTab = 'reminders';
  let listener = null;
  let baseline = null;
  let connectionBaseline = '';
  let savedFeishuEnabled = false;
  let updatePhase = 'idle';
  function showUpdateState(value) {
    if (value.phase === 'idle' || value.phase === 'manual') return;
    updatePhase = value.phase;
    $('update-state').textContent = value.message || '';
    $('download-update').hidden = value.phase !== 'available';
    $('install-update').hidden = value.phase !== 'ready';
    $('check-updates').disabled = ['checking', 'downloading', 'installing'].includes(value.phase);
    if (value.phase === 'downloading' || value.phase === 'ready') $('open-update').hidden = true;
  }
  const draft = () => ({ autoStartEnabled: $('autostart').checked, desktopEnabled: $('desktop').checked,
    feishuEnabled: $('feishu').checked, quietEnabled: $('quiet').checked,
    quietStart: $('quiet-start').value, quietEnd: $('quiet-end').value,
    preflightEnabled: $('preflight').checked,
    retryMinutes: $('preflight').checked ? Number($('retry').value) : baseline?.retryMinutes || 60 });
  const connectionValue = () => JSON.stringify(['app-id', 'recipient-id', 'lark-path'].map((id) => $(id).value));
  const connectionDirty = () => unlocked && (connectionValue() !== connectionBaseline || Boolean($('secret').value));
  const dirty = () => Boolean(baseline && (JSON.stringify(draft()) !== JSON.stringify(baseline) || connectionDirty()));
  function status(message, error = false) {
    $('status').textContent = message;
    $('status').classList.toggle('error', error);
  }
  async function notifyDraft() { await window.api.settingsDraft({ dirty: dirty() || accountDraftDirty, working: saving || accountWorking }); }
  function selectTab(tab, focus = false) {
    selectedTab = tab === 'accounts' ? 'accounts' : 'reminders';
    for (const name of ['reminders', 'accounts']) {
      const active = name === selectedTab;
      $(`${name}-tab`).setAttribute('aria-selected', String(active));
      $(`${name}-tab`).tabIndex = active ? 0 : -1;
      $(`${name}-panel`).hidden = !active;
    }
    if (focus) $(`${selectedTab}-tab`).focus();
    controls();
    if (selectedTab === 'accounts') accountController?.refresh();
  }
  function controls() {
    const blocked = saving || accountWorking || !baseline;
    for (const id of ['autostart', 'desktop', 'feishu', 'quiet', 'preflight', 'save', 'test', 'repair-codex']) $(id).disabled = blocked;
    $('cancel').disabled = saving || accountWorking;
    $('test').hidden = selectedTab === 'accounts';
    $('save').hidden = selectedTab === 'accounts' && !dirty();
    $('cancel').textContent = selectedTab === 'accounts' && !dirty() ? '关闭' : '取消';
    $('quiet-start').disabled = $('quiet-end').disabled = blocked || !$('quiet').checked;
    $('retry').disabled = blocked || !$('preflight').checked;
    $('channel-warning').hidden = $('desktop').checked || $('feishu').checked;
    connectionState();
    accountController?.setBlocked(saving);
  }
  function listenerState() {
    let label;
    if (!connected) label = '按钮监听：尚未配置机器人';
    else if (!savedFeishuEnabled) label = '按钮监听：飞书渠道已关闭';
    else if (!listener) label = '按钮监听：正在读取状态…';
    else if (listener.state === 'listening') label = listener.lastEventAt
      ? `按钮监听运行中 · 最近收到交互：${new Date(listener.lastEventAt).toLocaleString('zh-CN', { hour12: false })}`
      : '按钮监听运行中 · 尚未收到交互事件';
    else if (listener.state === 'occupied') label = '按钮监听被其他进程占用，当前程序不会处理飞书按钮';
    else if (listener.state === 'retrying') label = `按钮监听重试中：${listener.lastError || '请检查飞书 CLI'}`;
    else if (listener.state === 'unconfigured') label = '按钮监听：机器人配置不完整';
    else if (listener.state === 'disabled') label = '按钮监听：当前未运行';
    else label = '按钮监听：正在启动…';
    $('listener-state').textContent = label;
    const failed = connected && savedFeishuEnabled && ['occupied', 'retrying', 'unconfigured'].includes(listener?.state);
    $('feishu-state').textContent = failed ? '连接异常' : connected ? '已连接' : '未连接';
    $('feishu-state').classList.toggle('error', failed);
    $('feishu-state').title = failed ? label : connected ? '查看连接诊断' : '配置飞书连接';
  }
  async function refreshListenerState() {
    try { listener = await window.api.listenerStatus(); }
    catch (error) { listener = { state: 'retrying', lastError: error.message }; }
    listenerState();
  }
  async function refreshDiagnostics() {
    try {
      const checks = await window.api.diagnoseLocal();
      $('diagnostics').replaceChildren();
      for (const [name, value] of [['Codex', checks.codex], ['飞书', checks.feishu], ['按钮', checks.listener]]) {
        const row = document.createElement('li');
        row.textContent = `${name}：${value}`;
        $('diagnostics').appendChild(row);
      }
    } catch (error) { $('diagnostics').textContent = `本地检查失败：${error.message}`; }
  }
  function connectionState() {
    for (const id of ['app-id', 'recipient-id', 'lark-path', 'secret']) $(id).disabled = !unlocked || saving || accountWorking || !baseline;
    $('connect').disabled = !unlocked || saving || accountWorking || !baseline;
    $('reconnect').disabled = !connected || unlocked || saving || accountWorking || !baseline;
    listenerState();
  }
  function fill(settings) {
    connected = settings.feishuConnected;
    unlocked = !connected;
    $('autostart').checked = settings.autoStartEnabled;
    $('desktop').checked = settings.desktopEnabled;
    $('feishu').checked = settings.feishuEnabled;
    $('app-id').value = settings.appId;
    $('recipient-id').value = settings.recipientId;
    $('lark-path').value = settings.larkCliScript;
    $('secret').value = '';
    $('quiet').checked = settings.quietEnabled;
    $('quiet-start').value = settings.quietStart;
    $('quiet-end').value = settings.quietEnd;
    $('preflight').checked = settings.preflightEnabled;
    $('retry').value = settings.retryMinutes;
    savedFeishuEnabled = settings.feishuEnabled;
    baseline = draft();
    connectionBaseline = connectionValue();
    $('feishu-connection').open = settings.feishuEnabled && !connected;
    if (settings.version) $('update-state').textContent = `v${settings.version}`;
    controls();
  }
  accountController = createAccountsSettings({
    api: window.api,
    onWorking: async (working) => {
      accountWorking = working;
      controls();
      await notifyDraft();
    },
    onDraftDirty: async (value) => {
      accountDraftDirty = value;
      await notifyDraft();
    },
  });
  for (const name of ['reminders', 'accounts']) {
    $(`${name}-tab`).addEventListener('click', () => selectTab(name));
    $(`${name}-tab`).addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      selectTab(event.key === 'Home' ? 'reminders' : event.key === 'End' ? 'accounts'
        : selectedTab === 'accounts' ? 'reminders' : 'accounts', true);
    });
  }
  window.api.onSettingsTab?.((tab) => selectTab(tab));
  selectTab(location.hash.slice(1));
  controls();
  window.api.settingsRead().then(fill).catch((error) => status(error.message, true));
  window.api.onUpdateStatus(showUpdateState);
  window.api.updateStatus().then(showUpdateState).catch(() => {});
  refreshListenerState();
  refreshDiagnostics();
  setInterval(refreshListenerState, 5000);
  setInterval(refreshDiagnostics, 10000);
  $('feishu-state').addEventListener('click', () => {
    const panel = $(connected ? 'connection-diagnostics' : 'feishu-connection');
    panel.open = true;
    panel.scrollIntoView({ block: 'nearest' });
  });
  $('probe-codex').addEventListener('click', async () => {
    $('probe-codex').disabled = true;
    $('codex-probe').textContent = '检查中…';
    try { $('codex-probe').textContent = (await window.api.probeCodex()).message; }
    catch (error) { $('codex-probe').textContent = `检查失败：${error.message}`; }
    finally { $('probe-codex').disabled = false; }
  });
  $('repair-codex').addEventListener('click', async () => {
    if (saving || accountWorking) return;
    saving = true; controls();
    status('请选择 Codex 程序');
    try {
      await notifyDraft();
      const result = await window.api.repairCodex();
      status(result?.message || '已取消');
      if (result) refreshDiagnostics();
    } catch (error) { status(`连接未更新：${error.message}`, true); }
    finally { saving = false; controls(); notifyDraft().catch(() => {}); }
  });
  $('check-updates').addEventListener('click', async () => {
    $('check-updates').disabled = true;
    $('open-update').hidden = true;
    $('download-update').hidden = true;
    $('install-update').hidden = true;
    $('update-state').textContent = '检查中…';
    try {
      const result = await window.api.checkUpdates();
      $('update-state').textContent = result.message;
      $('download-update').hidden = result.state !== 'available' || !result.canInstall || result.phase === 'ready';
      $('install-update').hidden = result.phase !== 'ready';
      $('open-update').hidden = result.state !== 'available' || result.canInstall;
    } catch (error) { $('update-state').textContent = `检查失败：${error.message}`; }
    finally { $('check-updates').disabled = ['checking', 'downloading', 'installing'].includes(updatePhase); }
  });
  $('download-update').addEventListener('click', async () => {
    $('download-update').disabled = true;
    $('check-updates').disabled = true;
    try { showUpdateState(await window.api.downloadUpdate()); }
    catch (error) {
      $('update-state').textContent = `下载失败：${error.message}`;
      $('open-update').hidden = false;
    }
    finally { $('download-update').disabled = false; $('check-updates').disabled = ['checking', 'downloading', 'installing'].includes(updatePhase); }
  });
  $('install-update').addEventListener('click', async () => {
    $('install-update').disabled = true;
    try { await window.api.installUpdate(); }
    catch (error) { $('update-state').textContent = `升级未开始：${error.message}`; }
    finally { $('install-update').disabled = false; }
  });
  $('open-update').addEventListener('click', () => window.api.openUpdate()
    .catch((error) => { $('update-state').textContent = error.message; }));
  $('reminders-panel').querySelectorAll('input').forEach((input) => input.addEventListener('input', () => {
    controls();
    if ($('feishu').checked && !connected) $('feishu-connection').open = true;
    status(dirty() ? '未保存' : '');
    notifyDraft().catch((error) => status(error.message, true));
  }));
  $('reconnect').addEventListener('click', () => {
    if (!confirm('重新连接会更换飞书机器人配置。确认继续？')) return;
    unlocked = true;
    controls();
  });
  $('connect').addEventListener('click', async () => {
    if (saving || accountWorking) return;
    saving = true; controls();
    status('正在配置机器人并发送测试私聊…');
    try {
      await notifyDraft();
      const settings = await window.api.feishuConnect({
        appId: $('app-id').value, recipientId: $('recipient-id').value,
        larkCliScript: $('lark-path').value, secret: $('secret').value,
      });
      // 连接独立保存；保留用户尚未提交的免打扰和渠道草稿。
      connected = settings.feishuConnected;
      unlocked = !connected;
      savedFeishuEnabled = settings.feishuEnabled;
      $('feishu').checked = settings.feishuEnabled;
      baseline.feishuEnabled = settings.feishuEnabled;
      $('app-id').value = settings.appId;
      $('recipient-id').value = settings.recipientId;
      $('lark-path').value = settings.larkCliScript;
      $('secret').value = '';
      connectionBaseline = connectionValue();
      status(dirty() ? '已连接 · 其他修改未保存' : '已连接 · 测试消息已发送');
      setTimeout(refreshListenerState, 1000);
      refreshDiagnostics();
    } catch (error) { status(error.message, true); }
    finally { saving = false; controls(); notifyDraft().catch(() => {}); }
  });
  $('test').addEventListener('click', async () => {
    $('test').disabled = true;
    try { await window.api.testDesktopReminder(); status('测试提醒已显示'); }
    catch (error) { status(error.message, true); }
    finally { controls(); }
  });
  $('cancel').addEventListener('click', () => window.api.settingsClose().catch((error) => status(error.message, true)));
  $('save').addEventListener('click', async () => {
    if (saving || accountWorking) return;
    if (connectionDirty()) { selectTab('reminders'); status('请先连接并测试飞书', true); $('feishu-connection').open = true; return; }
    if ($('feishu').checked && !connected) { selectTab('reminders'); status('飞书尚未连接', true); $('feishu-connection').open = true; return; }
    if ($('quiet').checked && (!$('quiet-start').value || !$('quiet-end').value || $('quiet-start').value === $('quiet-end').value)) {
      selectTab('reminders'); status('免打扰起止时间不能为空或相同。', true); return;
    }
    if ($('preflight').checked && !$('retry').checkValidity()) {
      selectTab('reminders'); $('advanced-settings').open = true; $('retry').reportValidity(); return;
    }
    saving = true;
    controls();
    $('save').textContent = '保存中…';
    try {
      await notifyDraft();
      if (dirty()) fill(await window.api.settingsSave(draft()));
      saving = false;
      await notifyDraft();
      await window.api.settingsClose();
    } catch (error) { status(`保存失败：${error.message}`, true); }
    finally { saving = false; controls(); $('save').textContent = '保存'; notifyDraft().catch(() => {}); }
  });
</script>
</body>
</html>
