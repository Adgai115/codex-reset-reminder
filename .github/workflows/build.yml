name: Cross-platform desktop build

on:
  push:
    branches: [main, feature/cross-platform]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
          - os: ubuntu-latest
            target: --linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run probe:sqlite
      - run: npm run prepare:sidecar
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-package.mjs
      - name: Smoke first-run setup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --setup
      - name: Smoke packaged UI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: Smoke packaged sidecar (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs
        env:
          CODEX_RESET_MONITOR_CORE_MODE: sidecar
      - name: Smoke first-run setup
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --setup
      - name: Smoke packaged UI
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs
      - name: Smoke packaged sidecar
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs
        env:
          CODEX_RESET_MONITOR_CORE_MODE: sidecar
      - uses: actions/upload-artifact@v4
        with:
          name: codex-reset-reminder-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-release-tag.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-reset-reminder-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
