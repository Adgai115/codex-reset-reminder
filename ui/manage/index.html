<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Codex 重置卡提醒</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 0;
    background: Canvas; color: CanvasText; font-size: 14px; }
  header { padding: 14px 20px; border-bottom: 1px solid graytext; display: flex;
    justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  #sync-status { opacity: .75; font-size: 12px; }
  main { padding: 12px 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, graytext 35%, transparent); }
  th { font-weight: 600; opacity: .8; }
  tr:hover td { background: color-mix(in srgb, highlight 8%, transparent); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
    background: color-mix(in srgb, highlight 15%, transparent); }
  .badge.warn { background: color-mix(in srgb, crimson 18%, transparent); }
  .empty { padding: 40px; text-align: center; opacity: .6; }
  #mode { font-size: 11px; opacity: .5; }
  button { cursor: pointer; padding: 6px 10px; margin-left: 4px; }
  button:disabled { opacity: .6; cursor: wait; }
  #notice { min-height: 22px; color: #197449; }
  #notice.error { color: #b42318; }
  dialog { border: 1px solid #cbd5e1; border-radius: 12px; padding: 22px; width: 380px; }
  dialog::backdrop { background: #1b263780; }
  dialog label { display: block; margin: 12px 0; }
  dialog input, dialog select { display: block; width: 100%; padding: 8px; margin-top: 5px; }
  .actions { white-space: nowrap; }
  .actions button { font-size: 12px; padding: 4px 6px; }
</style>
</head>
<body>
<header>
  <h1>卡片管理 <span id="mode"></span></h1>
  <div>
    <span id="sync-status">加载中…</span>
    <button id="settings">提醒设置</button>
    <button id="add">新增手动卡</button>
    <button id="sync">立即同步 Codex</button>
  </div>
</header>
<main>
  <div id="notice" role="status" aria-live="polite"></div>
  <table id="cards">
    <thead><tr><th>名称</th><th>编号</th><th>到期时间</th><th>状态</th><th>稍后提醒</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="empty" class="empty" hidden>没有卡片。可以新增手动卡，或同步 Codex。</div>
</main>
<dialog id="card-dialog"><form id="card-form">
  <h2 id="dialog-title">新增手动卡</h2>
  <label>卡片名称<input id="card-title" required maxlength="120"></label>
  <label>到期时间（本地）<input id="card-expiry" type="datetime-local" required></label>
  <button type="button" id="cancel-card">取消</button><button>保存</button>
</form></dialog>
<dialog id="snooze-dialog"><form id="snooze-form">
  <h2>稍后提醒</h2><p id="snooze-title"></p>
  <label>提醒时间<select id="snooze-option"><option value="1d">1 天后</option><option value="3d">3 天后</option><option value="tomorrow10">明天 10:00</option></select></label>
  <button type="button" id="cancel-snooze">取消</button><button>确认延期</button>
</form></dialog>
<script>
  const $ = (id) => document.getElementById(id);
  const tbody = document.querySelector('#cards tbody');
  let editing = null;
  let snoozing = null;
  let busy = false;
  const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString('zh-CN', { hour12: false }) : '—';
  const addText = (parent, tag, content, className = '') => {
    const element = document.createElement(tag);
    element.textContent = content;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  };
  function notice(message, error = false) {
    $('notice').textContent = message;
    $('notice').classList.toggle('error', error);
  }
  async function action(op, args, success) {
    if (busy) return null;
    busy = true;
    try {
      const result = await window.api.core(op, args);
      await load();
      notice(success);
      return result;
    } catch (error) { notice(error.message, true); return null; }
    finally { busy = false; }
  }
  function addButton(parent, label, callback) {
    addText(parent, 'button', label).addEventListener('click', callback);
  }
  async function load() {
    if (!window.api) throw new Error('应用桥接未加载');
    const [status, cards, latest] = await Promise.all([
      window.api.coreStatus(), window.api.core('listCards', { includeInactive: true }),
      window.api.core('latestSync'),
    ]);
    $('mode').textContent = status.mode === 'in-process' ? '（内置 core）' : '（兼容模式）';
    $('sync-status').textContent = latest
      ? `上次核对：${fmt(latest.checkedAt)} · ${latest.outcome === 'complete' ? `${latest.availableCount} 张可用` : latest.outcome === 'failed' ? '同步失败' : '详情不完整'}`
      : '尚未同步';
    tbody.replaceChildren();
    for (const card of cards) {
      const snooze = card.status === 'available' ? await window.api.core('snooze', { cardId: card.id }) : null;
      const row = document.createElement('tr');
      addText(row, 'td', card.title);
      const idCell = addText(row, 'td', card.id.length > 24 ? `${card.id.slice(0, 24)}…` : card.id);
      idCell.title = card.id;
      addText(row, 'td', fmt(card.expiresAt));
      const days = Math.max(0, Math.ceil((card.expiresAt - Date.now() / 1000) / 86400));
      addText(addText(row, 'td', ''), 'span', card.status === 'available' ? `可用 · ${days} 天` :
        card.status === 'used' ? '已使用' : '不可用',
      `badge ${card.status === 'available' && days <= 3 ? 'warn' : ''}`);
      addText(row, 'td', snooze?.expiresAt === card.expiresAt ? fmt(snooze.targetAt) : '—');
      const buttons = addText(row, 'td', '', 'actions');
      if (card.status === 'available') {
        addButton(buttons, '稍后提醒', () => {
          snoozing = card;
          $('snooze-title').textContent = card.title;
          $('snooze-dialog').showModal();
        });
        if (snooze?.expiresAt === card.expiresAt) {
          addButton(buttons, '取消延期', () => action('clearSnooze', { cardId: card.id }, '已取消延期提醒'));
        }
        if (card.source === 'manual') {
          addButton(buttons, '编辑', () => openCardDialog(card));
          addButton(buttons, '已使用', () => {
            if (confirm(`确认将“${card.title}”标记为已使用？`))
              action('markManualUsed', { cardId: card.id }, '手动卡已标记为已使用');
          });
        } else if (!card.reportedUsedAt) {
          addButton(buttons, '反馈已使用', () => {
            if (confirm('这只记录使用反馈；下一次同步会核验 Codex 可用数量。继续吗？'))
              action('reportCardUsed', { cardId: card.id }, '已记录反馈，等待 Codex 核验');
          });
        }
      }
      tbody.appendChild(row);
    }
    $('empty').hidden = cards.length > 0;
    $('cards').hidden = cards.length === 0;
  }
  function openCardDialog(card = null) {
    editing = card;
    $('dialog-title').textContent = card ? '编辑手动卡' : '新增手动卡';
    $('card-title').value = card?.title ?? '';
    if (card) {
      const date = new Date(card.expiresAt * 1000);
      $('card-expiry').value = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}T${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    } else $('card-expiry').value = '';
    $('card-dialog').showModal();
  }
  $('add').addEventListener('click', () => openCardDialog());
  $('settings').addEventListener('click', () => window.api.openSettings()
    .catch((error) => notice(error.message, true)));
  $('cancel-card').addEventListener('click', () => $('card-dialog').close());
  $('cancel-snooze').addEventListener('click', () => $('snooze-dialog').close());
  $('card-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const expiresAt = Math.floor(new Date($('card-expiry').value).getTime() / 1000);
    const result = await action(editing ? 'updateManualCard' : 'addManualCard',
      { cardId: editing?.id, title: $('card-title').value, expiresAt },
      editing ? '手动卡已更新' : '手动卡已添加');
    if (result) $('card-dialog').close();
  });
  $('snooze-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const result = await action('scheduleSnooze',
      { cardId: snoozing.id, option: $('snooze-option').value }, '已安排稍后提醒');
    if (result) $('snooze-dialog').close();
  });
  $('sync').addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    $('sync').disabled = true;
    $('sync').textContent = '同步中…';
    notice('正在读取 Codex Usage…');
    try {
      const result = await window.api.core('syncCards');
      await load();
      notice(`同步完成：${result.availableCount} 张可用${result.complete ? '' : '（详情不完整）'}`);
    } catch (error) { notice(`同步失败：${error.message}`, true); await load(); }
    finally { busy = false; $('sync').disabled = false; $('sync').textContent = '立即同步 Codex'; }
  });
  load().catch((error) => { notice(`初始化失败：${error.message}`, true); $('sync-status').textContent = '读取失败'; });
</script>
</body>
</html>
