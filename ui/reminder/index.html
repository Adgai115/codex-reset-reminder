<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Codex 重置卡到期提醒</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; width:100%; height:100vh; display:flex; flex-direction:column; overflow:hidden;
    font:14px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; color:#1e293b;
    background:#fff; border:1px solid #dbe2ee; border-radius:12px; }
  header { display:flex; align-items:center; gap:8px; padding:11px 15px; background:#fff3e8;
    color:#9a410d; -webkit-app-region:drag; }
  #heading { white-space:nowrap; }
  #account { min-width:0; margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  #close, #prev, #next { -webkit-app-region:no-drag; border:0; background:transparent; color:inherit; cursor:pointer; }
  #close { font-size:19px; line-height:1; }
  main { flex:1; min-height:0; padding:15px 17px 7px; overflow:hidden; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  #days { font-size:24px; font-weight:700; color:#e45815; white-space:nowrap; }
  .pager { display:flex; align-items:center; gap:2px; color:#64748b; font-size:12px; white-space:nowrap; }
  .pager button { padding:4px 7px; font-size:15px; }
  #name-row { display:flex; gap:7px; min-width:0; margin:9px 0 5px; align-items:baseline; }
  #name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  #card-key { flex:none; color:#64748b; font-size:12px; white-space:nowrap; }
  #expiry { color:#64748b; font-size:12px; white-space:nowrap; }
  #feedback { color:#64748b; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 17px 5px; }
  #feedback.error { color:#b42318; }
  footer { display:flex; gap:8px; padding:0 17px 15px; }
  button, select { font:inherit; white-space:nowrap; }
  footer button, select { border:1px solid #cad3df; background:#fff; border-radius:7px; padding:8px 10px; cursor:pointer; }
  #reset { flex:1; background:#ee641b; border-color:#ee641b; color:#fff; }
  #option { width:125px; }
  button:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
  :focus-visible { outline:2px solid #b44a10; outline-offset:2px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><strong id="heading">Codex 重置卡</strong><span id="account" title="当前核对账号"></span><button id="close" aria-label="关闭">×</button></header>
<main>
  <div class="top"><div id="days"></div><div class="pager" id="pager" hidden><button id="prev" aria-label="上一张">‹</button><span id="position"></span><button id="next" aria-label="下一张">›</button></div></div>
  <div id="name-row"><span id="name"></span><span id="card-key"></span></div>
  <div id="expiry"></div>
</main>
<div id="feedback" role="status" aria-live="polite"></div>
<footer><button id="reset">立即重置</button><select id="option" aria-label="稍后提醒"></select></footer>
<script type="module" src="./app.mjs"></script>
</body>
</html>
