name: Cross-platform desktop build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
          - os: ubuntu-latest
            target: --linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      SIGN_WINDOWS: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
      SIGN_MAC: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run probe:sqlite
      - run: npm run prepare:sidecar
      - name: Prepare notarization key
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && env.SIGN_MAC == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/notarization-key.p8"
          chmod 600 "$RUNNER_TEMP/notarization-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notarization-key.p8" >> "$GITHUB_ENV"
      - name: Build package
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v') || env.SIGN_MAC != 'true'
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGN_WINDOWS == 'true' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGN_WINDOWS == 'true' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Build signed macOS package
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && env.SIGN_MAC == 'true'
        run: npx electron-builder --mac --config.mac.identity= --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify Windows release signatures
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1
      - name: Verify macOS release signature and notarization
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && env.SIGN_MAC == 'true'
        shell: bash
        run: bash scripts/verify-macos-signature.sh
      - run: node scripts/verify-package.mjs
      - name: Verify Windows update metadata
        if: runner.os == 'Windows'
        run: node scripts/verify-update-assets.mjs
      - name: Smoke first-run setup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --setup
      - name: Smoke packaged UI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: Smoke P0 reminder flow (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --p0
      - name: Smoke automatic recovery (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --recovery
      - name: Smoke pending and grouped reminders (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --pending
      - name: Smoke packaged sidecar (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --background
        env:
          CODEX_RESET_MONITOR_CORE_MODE: sidecar
      - name: Prepare isolated Linux keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Smoke multiple accounts (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            printf "ci-keyring-only\n" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node scripts/smoke-packaged.mjs --accounts
          '
      - name: Smoke multiple accounts with sidecar (Linux)
        if: runner.os == 'Linux'
        env:
          CODEX_RESET_MONITOR_CORE_MODE: sidecar
        run: |
          dbus-run-session -- bash -c '
            printf "ci-keyring-only\n" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node scripts/smoke-packaged.mjs --accounts
          '
      - name: Smoke first-run setup
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --setup
      - name: Smoke packaged UI
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs
      - name: Smoke P0 reminder flow
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --p0
      - name: Smoke automatic recovery
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --recovery
      - name: Smoke pending and grouped reminders
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --pending
      - name: Smoke packaged sidecar
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --background
        env:
          CODEX_RESET_MONITOR_CORE_MODE: sidecar
      - name: Smoke multiple accounts
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --accounts
      - name: Smoke multiple accounts with sidecar
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --accounts
        env:
          CODEX_RESET_MONITOR_CORE_MODE: sidecar
      - uses: actions/upload-artifact@v4
        with:
          name: codex-reset-reminder-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-release-tag.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-reset-reminder-*
          path: artifacts
          merge-multiple: true
      - name: Match GitHub asset names
        run: node scripts/normalize-release-assets.mjs artifacts
      - name: Verify Windows update assets
        run: node scripts/verify-update-assets.mjs artifacts
      - name: Generate SHA256 checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Attest published assets
        uses: actions/attest@v4
        with:
          subject-path: 'artifacts/*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
