<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>安装与连接</title>
<style>
  :root { color-scheme:light dark; --bg:#f5f7fb; --surface:#fff; --ink:#202f43; --muted:#607089;
    --line:#dce3ed; --accent:#245bcc; --tint:#edf3ff; --danger:#b84221; --primary-ink:#fff; }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#171c25; --surface:#202734; --ink:#e2e9f4; --muted:#a5b3c8; --line:#3b475a;
      --accent:#91b4ff; --tint:#293852; --danger:#ffb49e; --primary-ink:#182233; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; background:var(--bg); color:var(--ink);
    font:14px/1.5 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  main { height:100%; display:flex; flex-direction:column; padding:24px; overflow-y:auto; }
  h1 { font-size:22px; font-weight:600; line-height:1.3; margin:0 0 20px; }
  p { color:var(--muted); line-height:1.5; }
  .card { padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  label { display:block; font-weight:500; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:8px; }
  input:not([type=checkbox]) { flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; color:var(--ink); background:var(--surface); font:inherit; }
  input[type=checkbox] { width:16px; height:16px; margin:0; accent-color:var(--accent); flex:none; }
  .autostart-option { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0 0; padding-top:12px; border-top:1px solid var(--line); font-size:13px; cursor:pointer; }
  button { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; padding:8px 13px;
    font:inherit; cursor:pointer; white-space:nowrap; transition:background-color .15s, border-color .15s; }
  button:disabled { opacity:.5; cursor:wait; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--primary-ink); min-width:140px; }
  button:hover:not(:disabled) { border-color:var(--accent); background:var(--tint); }
  button.primary:hover:not(:disabled) { background:var(--accent); filter:brightness(1.07); }
  button:active:not(:disabled) { transform:translateY(1px); }
  footer { margin-top:auto; padding-top:20px; display:flex; justify-content:flex-end; }
  #status { color:var(--danger); margin-top:14px; font-size:12px; overflow-wrap:anywhere; }
  #status:empty, #probe-status:empty { display:none; }
  .help { margin-top:16px; color:var(--muted); font-size:12px; }
  summary { cursor:pointer; white-space:nowrap; padding:4px 0; }
  .help[open] summary { margin-bottom:8px; }
  .help p { margin:0 0 10px; }
  #discovery-status { font-size:12px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  small { display:block; color:var(--muted); margin-top:8px; line-height:1.5; overflow-wrap:anywhere; }
  @media (max-height:500px) { main { padding:18px 20px; } h1 { margin-bottom:16px; } }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>安装与连接</h1>
  <div class="card">
    <label for="path">Codex CLI 路径</label>
    <div class="row"><input id="path" placeholder="正在自动查找…" spellcheck="false"><button id="browse">浏览</button></div>
    <small id="discovery-status" role="status"></small>
    <label class="autostart-option"><span>登录时自动启动</span><input id="autostart" type="checkbox" checked></label>
  </div>
  <details class="help" id="connection-help"><summary>连接帮助</summary>
    <p>请先安装并登录 Codex CLI。连接时只读取用量，不会使用重置卡。</p>
    <button id="probe" type="button">检查连接</button>
    <small id="probe-status" role="status" aria-live="polite"></small>
  </details>
  <div id="status" role="status" aria-live="polite"></div>
  <footer><button id="connect" class="primary">连接并开始</button></footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let busy = false;
  function working(value) {
    busy = value;
    for (const id of ['path', 'browse', 'probe', 'autostart', 'connect']) $(id).disabled = value;
  }
  window.api.setupDiscover().then((result) => {
    $('path').value = result.codexScript || '';
    $('path').placeholder = result.codexScript ? '' : '未自动找到，请浏览选择';
    $('discovery-status').textContent = result.codexScript ? '已找到 Codex' : '未找到 Codex，请选择路径';
  }).catch((error) => { $('status').textContent = error.message; });
  $('path').addEventListener('input', () => { $('discovery-status').textContent = ''; $('probe-status').textContent = ''; });
  $('probe').addEventListener('click', async () => {
    if (busy) return;
    working(true);
    $('probe-status').textContent = '检查中…';
    try { $('probe-status').textContent = (await window.api.setupProbeCodex($('path').value)).message; }
    catch (error) { $('probe-status').textContent = `检查失败：${error.message}`; }
    finally { working(false); }
  });
  $('browse').addEventListener('click', async () => {
    if (busy) return;
    working(true);
    try {
      const path = await window.api.setupBrowse();
      if (path) { $('path').value = path; $('probe-status').textContent = ''; $('discovery-status').textContent = ''; }
    }
    catch (error) { $('status').textContent = error.message; }
    finally { working(false); }
  });
  $('connect').addEventListener('click', async () => {
    if (busy) return;
    if (!$('path').value.trim()) { $('status').textContent = '请选择 Codex 程序'; $('path').focus(); return; }
    working(true);
    $('connect').textContent = '连接中…';
    $('status').textContent = '';
    try {
      const result = await window.api.setupSave({ codexScript: $('path').value,
        autoStartEnabled: $('autostart').checked });
      $('status').textContent = result.message;
    } catch (error) {
      $('status').textContent = `连接失败：${error.message}`;
      working(false);
      $('connect').textContent = '连接并开始';
    }
  });
</script>
</body>
</html>
