<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>安装与连接</title>
<style>
  :root { color-scheme:light dark; --bg:#f6f8fc; --surface:#fff; --ink:#1c2b40; --muted:#617189;
    --line:#dce5f0; --field-line:#cad5e2; --button-line:#c8d3e2; --hint:#75849a;
    --danger:#b42318; --accent:#1458df; }
  @media (prefers-color-scheme:dark) { :root { --bg:#171c25; --surface:#202734; --ink:#e2e9f4;
    --muted:#a5b3c8; --line:#3b475a; --field-line:#495972; --button-line:#495972; --hint:#a5b3c8;
    --danger:#ffb49e; --accent:#91b4ff; } }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  main { padding: 27px 30px; }
  h1 { font-size: 23px; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.55; }
  .card { margin-top: 20px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
  label { display: block; font-weight: 600; margin-bottom: 9px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; border: 1px solid var(--field-line); border-radius: 7px; padding: 9px; background:var(--surface); color:var(--ink); font: inherit; }
  button { border: 1px solid var(--button-line); background: var(--surface); border-radius: 7px; padding: 9px 14px;
    font: inherit; color:var(--ink); cursor: pointer; white-space:nowrap; }
  button:disabled { opacity: .55; cursor: wait; }
  button.primary { background: #1458df; border-color: #1458df; color: white; }
  footer { margin-top: 20px; display: flex; justify-content: flex-end; }
  #status { color: var(--danger); margin-top: 12px; }
  #status:empty, #probe-status:empty { display:none; }
  .help { margin-top:18px; color:var(--muted); font-size:12px; }
  summary { cursor:pointer; white-space:nowrap; }
  #discovery-status { margin-bottom:14px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  small { display: block; color: var(--hint); margin-top: 10px; line-height: 1.5; }
  .autostart-option { margin-top:14px; font-weight:normal; }
  .autostart-option input { accent-color:#1458df; }
  #status, small, .help p { overflow-wrap:anywhere; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:active:not(:disabled) { transform:translateY(1px); }
</style>
</head>
<body>
<main>
  <h1>安装与连接</h1>
  <div class="card">
    <label for="path">Codex CLI 路径</label>
    <div class="row"><input id="path" placeholder="正在自动查找…" spellcheck="false"><button id="browse">浏览</button></div>
    <small id="discovery-status" role="status"></small>
    <label class="autostart-option"><input id="autostart" type="checkbox" checked> 登录时自动启动</label>
  </div>
  <details class="help" id="connection-help"><summary>连接帮助</summary>
    <p>请先安装并登录 Codex CLI。连接时只读取用量，不会使用重置卡。</p>
    <button id="probe" type="button">检查连接</button>
    <small id="probe-status" role="status" aria-live="polite"></small>
  </details>
  <div id="status" role="status" aria-live="polite"></div>
  <footer><button id="connect" class="primary">连接并开始</button></footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let busy = false;
  function working(value) {
    busy = value;
    for (const id of ['path', 'browse', 'probe', 'autostart', 'connect']) $(id).disabled = value;
  }
  window.api.setupDiscover().then((result) => {
    $('path').value = result.codexScript || '';
    $('path').placeholder = result.codexScript ? '' : '未自动找到，请浏览选择';
    $('discovery-status').textContent = result.codexScript ? '已找到 Codex' : '未找到 Codex，请选择路径';
  }).catch((error) => { $('status').textContent = error.message; });
  $('path').addEventListener('input', () => { $('discovery-status').textContent = ''; $('probe-status').textContent = ''; });
  $('probe').addEventListener('click', async () => {
    if (busy) return;
    working(true);
    $('probe-status').textContent = '检查中…';
    try { $('probe-status').textContent = (await window.api.setupProbeCodex($('path').value)).message; }
    catch (error) { $('probe-status').textContent = `检查失败：${error.message}`; }
    finally { working(false); }
  });
  $('browse').addEventListener('click', async () => {
    if (busy) return;
    working(true);
    try {
      const path = await window.api.setupBrowse();
      if (path) { $('path').value = path; $('probe-status').textContent = ''; $('discovery-status').textContent = ''; }
    }
    catch (error) { $('status').textContent = error.message; }
    finally { working(false); }
  });
  $('connect').addEventListener('click', async () => {
    if (busy) return;
    if (!$('path').value.trim()) { $('status').textContent = '请选择 Codex 程序'; $('path').focus(); return; }
    working(true);
    $('connect').textContent = '连接中…';
    $('status').textContent = '';
    try {
      const result = await window.api.setupSave({ codexScript: $('path').value,
        autoStartEnabled: $('autostart').checked });
      $('status').textContent = result.message;
    } catch (error) {
      $('status').textContent = `连接失败：${error.message}`;
      working(false);
      $('connect').textContent = '连接并开始';
    }
  });
</script>
</body>
</html>
