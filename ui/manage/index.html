<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Codex 重置卡提醒</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fb; --surface: #fff; --ink: #202f43; --muted: #607089;
    --line: #dce3ed; --accent: #245bcc; --tint: #edf3ff; --danger: #b84221; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171c25; --surface:#202734; --ink:#e2e9f4;
    --muted:#a5b3c8; --line:#3b475a; --accent:#91b4ff; --tint:#293852; --danger:#ffb49e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
  header { padding:20px 24px 14px; }
  .topbar { display:flex; align-items:center; gap:24px; }
  h1 { font-size:21px; margin:0; letter-spacing:-.5px; font-weight:600; white-space:nowrap; }
  h2 { font-size:20px; margin:0 0 16px; }
  p { margin:4px 0; }
  .status-row { display:flex; gap:18px; align-items:start; margin-top:12px; font-size:12px; color:var(--muted); }
  #sync-info { min-width:0; }
  .detail-text { max-width:52ch; margin-top:7px; overflow-wrap:anywhere; }
  #automation-status { margin-top:5px; }
  .account-bar { display:flex; gap:10px; align-items:start; min-width:0; }
  #account-info { min-width:0; }
  #account-status { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #account-status.warning { color:var(--danger); }
  #account-detail { max-width:64ch; padding:6px 0; overflow-wrap:anywhere; }
  .account-bar button { font-size:12px; padding:3px 8px; }
  .toolbar { display:flex; gap:8px; flex-shrink:0; }
  .account-select { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  #account-select { width:280px; max-width:100%; min-width:0; padding:7px 10px; text-overflow:ellipsis; }
  .account-select button { padding:7px 9px; font-size:12px; flex:none; }
  .listbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:12px; }
  .viewbar { display:flex; gap:4px; flex:none; }
  .viewbar button { font-size:13px; padding:7px 10px; background:transparent; border-color:transparent; }
  .viewbar button[aria-pressed=true] { color:var(--accent); background:var(--tint); font-weight:600; }
  .records th:first-child { width:130px; }
  .records.sync-records th:nth-child(2) { width:110px; }
  .records.sync-records th:nth-child(3), .records.sync-records th:nth-child(4) { width:85px; }
  .records.reminder-records th:nth-child(2) { width:30%; }
  .records.reminder-records th:nth-child(3) { width:100px; }
  .records.reminder-records th:nth-child(4) { width:130px; }
  .records td { font-size:13px; }
  .records td.single-cell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .record-detail { display:block; padding:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; font-size:12px; color:var(--muted); background:transparent; border:0; text-align:left; }
  .record-detail:hover:not(:disabled) { text-decoration:underline; background:transparent; }
  dialog { width:min(680px,calc(100vw - 40px)); max-height:85vh; padding:22px; border:1px solid var(--line);
    border-radius:12px; background:var(--surface); color:var(--ink); }
  dialog::backdrop { background:rgba(20,30,45,.3); }
  .dialog-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .dialog-top h2 { font-size:18px; margin:0; }
  .account-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:13px 0; border-top:1px solid var(--line); }
  .account-name { display:flex; align-items:center; gap:8px; }
  .account-name { min-width:0; }
  .account-name input { width:190px; min-width:0; padding:6px 8px; font-size:13px; }
  .account-actions { display:flex; gap:8px; align-items:center; }
  .account-actions button { padding:4px 8px; font-size:12px; }
  .account-actions label { white-space:nowrap; font-size:12px; }
  .account-actions input { accent-color:var(--accent); }
  #login-status { color:var(--muted); font-size:12px; margin:10px 0; }
  .dialog-bottom { display:flex; align-items:center; gap:10px; margin-top:16px; }
  main { padding:0 24px 20px; }
  button, input, select { font:inherit; border:1px solid var(--line); border-radius:7px; padding:8px 12px; background:var(--surface); color:var(--ink); }
  button, select, summary { white-space:nowrap; }
  button { cursor:pointer; transition:background .15s, border-color .15s; }
  button:hover:not(:disabled) { background:var(--tint); border-color:var(--accent); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .table-wrap:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:#245bcc; color:white; border-color:#245bcc; }
  button.primary:hover:not(:disabled) { background:#194dab; }
  .filterbar { display:flex; align-items:center; gap:10px; min-width:0; }
  .filters { display:flex; gap:2px; padding:3px; background:color-mix(in srgb,var(--line) 35%,var(--bg)); border-radius:8px; }
  .filters button { background:transparent; border-color:transparent; font-size:12px; padding:4px 9px; }
  .filters button[aria-pressed=true] { background:var(--surface); color:var(--ink); font-weight:600; }
  #channel-status { color:var(--danger); font-size:12px; padding:4px 8px; background:transparent; border:0; }
  #notice-box { margin-bottom:12px; color:var(--muted); font-size:12px; }
  #notice { display:list-item; list-style-position:inside; }
  #notice-detail { overflow-wrap:anywhere; padding:7px 0; }
  .error, #notice.error { color:var(--danger); }
  .table-wrap { border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:auto; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:500; padding-top:11px; padding-bottom:11px; }
  tr:last-child td { border-bottom:0; }
  #cards th:nth-child(2) { width:145px; } #cards th:nth-child(3) { width:28%; }
  #cards th:nth-child(4) { width:154px; }
  th { white-space:nowrap; }
  .card-name { font-weight:600; }
  .card-label { display:flex; align-items:baseline; min-width:0; gap:6px; }
  .card-label .card-name { min-width:0; }
  .card-key { flex:none; color:var(--muted); font-size:11px; white-space:nowrap; }
  .sub { color:var(--muted); font-size:12px; margin-top:5px; }
  .single-line { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .time { font-variant-numeric:tabular-nums; font-size:12px; white-space:nowrap; }
  .expiry-time { display:block; margin-top:4px; color:var(--muted); }
  .badge { display:inline-block; white-space:nowrap; padding:2px 7px; border-radius:4px; background:var(--tint); color:var(--accent); font-size:12px; }
  .badge.urgent { color:var(--danger); background:color-mix(in srgb,var(--danger) 10%,var(--surface)); }
  .badge.normal, .badge.pending { color:var(--ink); background:transparent; padding-left:0; }
  .badge.muted { color:var(--muted); background:var(--bg); }
  .actions { display:flex; gap:6px; align-items:center; }
  .actions button, .actions select { font-size:12px; padding:5px 6px; }
  .actions select { width:88px; flex:none; }
  .actions .card-details { padding:5px 3px; background:transparent; border-color:transparent; color:var(--muted); }
  summary { cursor:pointer; color:var(--muted); }
  .delivery-compact { font-size:12px; }
  .delivery-actions { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .pending-reminder { color:var(--accent); background:transparent; border:0; padding:0; font-size:12px; white-space:nowrap; }
  .delivery-summary { display:flex; align-items:baseline; justify-content:space-between; gap:8px; white-space:nowrap; }
  .delivery-summary > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .delivery-summary .time { color:var(--muted); font-size:12px; flex:none; }
  .retry-button { color:var(--danger); background:transparent; border:0; font-size:12px; padding:0; }
  .delivery-node { margin-bottom:10px; padding-bottom:9px; border-bottom:1px solid var(--line); }
  .delivery-node:last-child { margin-bottom:0; padding-bottom:0; border-bottom:0; }
  .delivery-title { font-size:12px; font-weight:600; }
  .delivery-line { margin-top:4px; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
  .delivery-line.failed { color:var(--danger); }
  .delivery-line .sub { display:block; margin-top:1px; }
  .delivery-line button { font-size:11px; padding:2px 5px; margin-top:3px; }
  .detail-meta { display:grid; grid-template-columns:60px minmax(0,1fr); gap:8px 12px; margin:18px 0; font-size:13px; }
  .detail-meta dt { color:var(--muted); } .detail-meta dd { margin:0; overflow-wrap:anywhere; }
  #detail-body { overflow-wrap:anywhere; } #detail-body .retry-button { margin-top:6px; }
  #detail-dialog .delivery-node { padding:12px 0; margin:0; }
  #detail-dialog .delivery-line { margin-top:8px; }
  #detail-dialog .detail-message { white-space:pre-wrap; font-size:13px; }
  .empty { padding:44px 20px; text-align:center; color:var(--muted); }
  [hidden] { display:none !important; }
  @media (max-width:850px) { header { padding:16px 16px 12px; } main { padding:0 16px 18px; }
    .topbar { gap:16px; } h1 { font-size:19px; } .toolbar { gap:6px; } .toolbar button { padding:7px 10px; }
    .listbar { gap:8px; } .viewbar button { padding:7px 8px; } }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
</style>
</head>
<body>
<header>
  <div class="topbar"><h1>重置卡管理</h1>
    <div class="account-select"><select id="account-select" aria-label="查看账号"></select><button id="manage-accounts">账号管理</button></div>
    <div class="toolbar"><button id="sync" title="后台每 15 分钟自动同步，也可立即刷新">刷新</button><button id="settings">提醒设置</button></div>
  </div>
    <div class="status-row"><details id="sync-info"><summary id="sync-status" role="status">读取中…</summary>
      <div class="detail-text"><p id="sync-detail"></p><p id="automation-status"></p></div></details>
    <div class="account-bar"><details id="account-info"><summary id="account-status">核对账号…</summary>
      <p id="account-detail"></p><button id="check-account">重新核对账号</button></details>
      <button id="bind-account" hidden>确认账号</button></div></div>
</header>
<main>
  <div class="listbar"><nav class="viewbar" aria-label="账号信息"><button id="cards-view" aria-pressed="true">卡片</button><button id="sync-view" aria-pressed="false">同步记录</button><button id="reminders-view" aria-pressed="false">提醒记录</button></nav>
  <div class="filterbar">
    <div class="filters" aria-label="卡片范围"><button id="active-filter" aria-pressed="true">可用卡</button><button id="pending-filter" aria-pressed="false" hidden>已提醒</button><button id="history-filter" aria-pressed="false">已结束</button></div>
    <button id="channel-status" hidden>提醒已关闭</button>
  </div></div>
  <details id="notice-box" hidden><summary id="notice" class="single-line" role="status" aria-live="polite"></summary><p id="notice-detail"></p></details>
  <div class="table-wrap" tabindex="0" role="region" aria-label="卡片列表">
    <table id="cards"><thead><tr><th scope="col">卡片</th><th scope="col" title="状态与到期时间；电脑本地时间">到期</th><th scope="col">提醒</th><th scope="col">操作</th></tr></thead><tbody></tbody></table>
    <div id="empty" class="empty" hidden></div>
  </div>
  <div id="record-wrap" class="table-wrap" hidden tabindex="0" role="region" aria-label="当前账号记录">
    <table id="records" class="records"><thead></thead><tbody></tbody></table><div id="records-empty" class="empty" hidden>暂无记录</div>
  </div>
</main>
<dialog id="accounts-dialog" aria-labelledby="accounts-title">
  <div class="dialog-top"><h2 id="accounts-title">账号管理</h2><button id="close-accounts">关闭</button></div>
  <div id="account-list"></div>
  <p id="account-notice" role="status" aria-live="polite" class="detail-message"></p>
  <p id="login-status" role="status" aria-live="polite"></p>
  <div class="dialog-bottom"><button id="add-account" class="primary">添加账号</button><button id="get-current-account">获取 Codex 当前账号</button><button id="cancel-login" hidden>取消登录</button></div>
</dialog>
<dialog id="detail-dialog" aria-labelledby="detail-title">
  <div class="dialog-top"><h2 id="detail-title">卡片详情</h2><button id="close-detail">关闭</button></div>
  <p id="detail-notice" role="status" aria-live="polite" class="detail-message"></p>
  <div id="detail-body"></div>
</dialog>
<script type="module" src="./app.mjs"></script>
</body>
</html>
