<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Codex 重置卡提醒</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fb; --surface: #fff; --ink: #202f43; --muted: #607089;
    --line: #dce3ed; --accent: #245bcc; --tint: #edf3ff; --danger: #b84221; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171c25; --surface:#202734; --ink:#e2e9f4;
    --muted:#a5b3c8; --line:#3b475a; --accent:#91b4ff; --tint:#293852; --danger:#ffb49e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
  header { padding:22px 24px 14px; display:flex; justify-content:space-between; gap:20px; align-items:start; }
  .heading { flex:1; min-width:0; }
  h1 { font-size:23px; margin:0 0 10px; letter-spacing:-.5px; font-weight:600; }
  h2 { font-size:20px; margin:0 0 16px; }
  p { margin:4px 0; }
  .status-row { display:flex; gap:18px; align-items:start; font-size:12px; color:var(--muted); }
  #sync-info { min-width:0; }
  .detail-text { max-width:52ch; margin-top:7px; overflow-wrap:anywhere; }
  #automation-status { margin-top:5px; }
  .account-bar { display:flex; gap:10px; align-items:start; min-width:0; }
  #account-info { min-width:0; }
  #account-status { overflow:hidden; text-overflow:ellipsis; }
  #account-status.warning { color:var(--danger); }
  #account-detail { max-width:64ch; padding:6px 0; overflow-wrap:anywhere; }
  .account-bar button { font-size:12px; padding:3px 8px; }
  .toolbar { display:flex; gap:8px; flex-shrink:0; }
  main { padding:0 24px 20px; }
  button, input, select { font:inherit; border:1px solid var(--line); border-radius:7px; padding:8px 12px; background:var(--surface); color:var(--ink); }
  button, select, summary { white-space:nowrap; }
  button { cursor:pointer; transition:background .15s, border-color .15s; }
  button:hover:not(:disabled) { background:var(--tint); border-color:var(--accent); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .table-wrap:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:#245bcc; color:white; border-color:#245bcc; }
  button.primary:hover:not(:disabled) { background:#194dab; }
  .filterbar { display:flex; justify-content:space-between; align-items:center; padding:8px 0 12px; gap:16px; }
  .filters { display:flex; gap:5px; }
  .filters button { background:transparent; border-color:transparent; }
  .filters button[aria-pressed=true] { background:var(--surface); border-color:var(--line); font-weight:600; }
  #channel-status { color:var(--danger); font-size:12px; padding:4px 8px; background:transparent; border:0; }
  #notice-box { margin-bottom:12px; color:var(--muted); font-size:12px; }
  #notice { display:list-item; list-style-position:inside; }
  #notice-detail { overflow-wrap:anywhere; padding:7px 0; }
  .error, #notice.error { color:var(--danger); }
  .table-wrap { border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:auto; }
  table { width:100%; min-width:1060px; border-collapse:collapse; table-layout:fixed; }
  th, td { text-align:left; padding:14px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:500; padding-top:11px; padding-bottom:11px; }
  tr:last-child td { border-bottom:0; }
  th:nth-child(1) { width:26%; } th:nth-child(2) { width:15%; } th:nth-child(3) { width:12%; }
  th:nth-child(4) { width:30%; } th:nth-child(5) { width:17%; }
  th { white-space:nowrap; }
  .card-name { font-weight:600; }
  .sub { color:var(--muted); font-size:12px; margin-top:5px; }
  .single-line { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .time { font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; }
  .badge { display:inline-block; white-space:nowrap; padding:2px 7px; border-radius:4px; background:var(--tint); color:var(--accent); font-size:12px; }
  .badge.urgent { color:var(--danger); background:color-mix(in srgb,var(--danger) 10%,var(--surface)); }
  .badge.normal, .badge.pending { color:var(--ink); background:transparent; padding-left:0; }
  .badge.muted { color:var(--muted); background:var(--bg); }
  .actions { display:flex; gap:6px; align-items:start; }
  .actions button, .actions select { font-size:12px; padding:5px 6px; }
  .actions select { width:88px; }
  summary { cursor:pointer; color:var(--muted); }
  .actions .more-actions { width:56px; }
  .delivery-compact { font-size:12px; }
  .pending-reminder { color:var(--danger); font-size:12px; font-weight:600; margin-bottom:4px; white-space:nowrap; }
  .delivery-summary { display:flex; align-items:baseline; justify-content:space-between; gap:8px; white-space:nowrap; }
  .delivery-summary .time { color:var(--muted); font-size:12px; }
  .delivery-details { font-size:12px; margin-top:6px; }
  .delivery-details[open] > summary { margin-bottom:8px; }
  .retry-button { margin-top:6px; font-size:12px; padding:3px 7px; }
  .delivery-node { margin-bottom:10px; padding-bottom:9px; border-bottom:1px solid var(--line); }
  .delivery-node:last-child { margin-bottom:0; padding-bottom:0; border-bottom:0; }
  .delivery-title { font-size:12px; font-weight:600; }
  .delivery-line { margin-top:4px; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
  .delivery-line.failed { color:var(--danger); }
  .delivery-line .sub { display:block; margin-top:1px; }
  .delivery-line button { font-size:11px; padding:2px 5px; margin-top:3px; }
  .empty { padding:44px 20px; text-align:center; color:var(--muted); }
  [hidden] { display:none !important; }
  @media (max-width:850px) { header { padding:18px 16px 12px; gap:12px; } main { padding:0 16px 18px; } .toolbar { gap:6px; } }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
</style>
</head>
<body>
<header>
  <div class="heading"><h1>重置卡管理</h1>
    <div class="status-row"><details id="sync-info"><summary id="sync-status" role="status">读取中…</summary>
      <div class="detail-text"><p id="sync-detail"></p><p id="automation-status"></p></div></details>
    <div class="account-bar"><details id="account-info"><summary id="account-status">核对账号…</summary>
      <p id="account-detail"></p><button id="check-account">重新核对账号</button></details>
      <button id="bind-account" hidden>确认账号</button></div></div></div>
  <div class="toolbar"><button id="sync" title="后台每 15 分钟自动同步，也可立即刷新">刷新</button><button id="settings">提醒设置</button></div>
</header>
<main>
  <div class="filterbar">
    <div class="filters" aria-label="卡片范围"><button id="active-filter" aria-pressed="true">可用卡</button><button id="pending-filter" aria-pressed="false" hidden>待处理</button><button id="history-filter" aria-pressed="false">历史卡</button></div>
    <button id="channel-status" hidden>提醒已关闭</button>
  </div>
  <details id="notice-box" hidden><summary id="notice" class="single-line" role="status" aria-live="polite"></summary><p id="notice-detail"></p></details>
  <div class="table-wrap" tabindex="0" role="region" aria-label="卡片列表；窄窗口可左右滚动">
    <table id="cards"><thead><tr><th>卡片</th><th title="电脑本地时间">到期时间</th><th>状态</th><th>提醒</th><th>操作</th></tr></thead><tbody></tbody></table>
    <div id="empty" class="empty" hidden></div>
  </div>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
